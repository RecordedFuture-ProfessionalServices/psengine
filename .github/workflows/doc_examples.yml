name: Doc Examples

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-doc-py:
    runs-on: ubuntu-latest
    env:
      RF_TOKEN: ${{ secrets.RF_TOKEN }}
      RF_ASI_TOKEN: ${{ secrets.RF_ASI_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install GNU parallel
        run: sudo apt-get update && sudo apt-get install -y parallel

      - name: Set up Python
        run: uv python install ${{ vars.PYTHON_VERSION }}

      - name: Set up venv
        run: |
          uv sync --group docs --no-default-groups

      - name: Run Examples
        shell: bash
        run: |
          set -euo pipefail

          KNOWN_FAILS=(
            "./docs/examples/error_handling/example_1a.py"
            "./docs/examples/error_handling/example_1b.py"
            "./docs/examples/error_handling/example_3.py"
            "./docs/examples/config/example_6.py"
          )

          KNOWN_FAILS_FILE="$(mktemp)"
          RETRY_LIST_FILE="$(mktemp)"
          trap 'rm -f "$KNOWN_FAILS_FILE" "$RETRY_LIST_FILE"' EXIT

          printf '%s\n' "${KNOWN_FAILS[@]}" > "$KNOWN_FAILS_FILE"

          run_one() {
            local file="$1"
            local list_file="$2"
            local safe_log="err-$(echo "$file" | tr '/' '_').log"

            if grep -Fxq -- "$file" "$list_file"; then
              uv run "$file" &> "$safe_log"
              local rc=$?
              if [[ $rc -ne 1 ]]; then
                echo "$file failed (exit code $rc, expected 1)"
                return 1
              fi
            else
              uv run "$file" &> /dev/null
              local rc=$?
              if [[ $rc -ne 0 ]]; then
                echo "$file failed (exit code $rc)"
                return 1
              fi
            fi
          }

          run_one_capture() {
            local file="$1"
            local list_file="$2"
            local retry_file="$3"

            if ! run_one "$file" "$list_file"; then
              echo "$file" >> "$retry_file"
              return 1
            fi
          }

          export -f run_one
          export -f run_one_capture

          set +e
          find ./docs/examples -type f -name "*.py" -print0 \
            | parallel -0 -j 30 run_one_capture {} "$KNOWN_FAILS_FILE" "$RETRY_LIST_FILE"
          parallel_rc=$?
          set -e

          if [[ $parallel_rc -ne 0 ]]; then
            echo "Parallel run had failures. Re-running failed files serially..."

            sort -u "$RETRY_LIST_FILE" -o "$RETRY_LIST_FILE"

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              echo "Retrying: $file"
              run_one "$file" "$KNOWN_FAILS_FILE"
            done < "$RETRY_LIST_FILE"
          fi

          echo "All done ✅"
