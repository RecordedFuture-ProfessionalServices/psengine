name: Doc Examples

on:
  workflow_dispatch:
  schedule:
    # Nightly at 04:15 UTC — decoupled from merges so a flaky RF API never blocks docs.
    - cron: "15 4 * * *"

permissions:
  contents: read
  issues: write

jobs:
  run-doc-py:
    runs-on: ubuntu-latest
    env:
      RF_TOKEN: ${{ secrets.RF_TOKEN }}
      RF_ASI_TOKEN: ${{ secrets.RF_ASI_TOKEN }}
      RF_SANDBOX_TOKEN: ${{ secrets.RF_SANDBOX_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install GNU parallel
        run: sudo apt-get update && sudo apt-get install -y parallel

      - name: Set up Python
        run: uv python install ${{ vars.PYTHON_VERSION }}

      - name: Set up venv
        run: uv sync --group docs --no-default-groups

      - name: Run examples
        id: run
        run: ./scripts/run_doc_examples.sh

      - name: Upload attempt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-example-logs
          path: /tmp/doc-examples-*/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_COUNT: ${{ steps.run.outputs.failed_count }}
          FAILED_FILES: ${{ steps.run.outputs.failed_files }}
        run: |
          set -euo pipefail
          title="Doc examples failing on nightly run"

          body=$(cat <<EOF
          The nightly \`Doc Examples\` workflow failed.

          - Run: $RUN_URL
          - Failed count: ${FAILED_COUNT:-unknown}

          Failed files:
          \`\`\`
          ${FAILED_FILES:-see run logs}
          \`\`\`

          Per-attempt logs are attached to the run as the \`doc-example-logs\` artifact.
          EOF
          )

          existing=$(gh issue list \
            --state open \
            --search "in:title \"$title\"" \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -n1)

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "docs,ci"
          fi
