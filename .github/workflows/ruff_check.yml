name: Lint

on: 
  workflow_dispatch:
  pull_request:

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --ignore FIX --output-format=github"
