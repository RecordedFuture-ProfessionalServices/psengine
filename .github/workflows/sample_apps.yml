name: Run-Example-Apps

on: 
  workflow_dispatch:

jobs:
  run-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        apps: ["analyst_notes", "base_http_client", "classic_alerts", "collective_insights", "config", "detection", "enrichment", "identity", "lists", "markdown", "playbook_alerts", "rf_client", "risklists", "stix2"]
    env:
      RF_TOKEN: ${{ secrets.RF_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          
      - name: Run ${{matrix.apps}}
        run: python examples/${{matrix.apps}}/run_${{matrix.apps}}.py