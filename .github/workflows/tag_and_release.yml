name: Tag and Release

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed                

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.get_version.outputs.version }}
      tag_exists:  ${{ steps.tagcheck.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tagcheck
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    if: >
      github.event.pull_request.merged == true &&
      needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Export version to env
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Create Git tag
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"

      - name: Create GitHub Release
        uses: comnoco/create-release-action@v2.0.5
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          tag_name:     ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body:         ${{ github.event.pull_request.body }}


