[project]
name = "psengine"
version = "2.10.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <3.15"
description = "psengine is a simple, yet elegant, library for rapid development of integrations with Recorded Future."

authors = [
    {name = "Moise Medici", email = "moise.medici@recordedfuture.com"},
    {name = "Patrick Kinsella", email = "patrick.kinsella@recordedfuture.com"},
    {name = "Ernest Bartosevic", email = "ernest.bartosevic@recordedfuture.com"},
]
keywords = ['API', 'Recorded Future', 'Cyber Security Engineering', 'Threat Intelligence']

classifiers=[
        "Development Status :: 5 - Production/Stable",
        "Programming Language :: Python",
        "Intended Audience :: Developers",
        "Topic :: Security",
        "Topic :: Software Development :: Libraries",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14"
]

dependencies = [ 
    "typing_extensions >= 4.8.0", 
    "requests>=2.33.1",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "jsonpath_ng>=1.5.3, <=1.8.0",
    "stix2~=3.0.2",
    "python-dateutil>=2.7.0",
    "more-itertools>=9.0.0, <=11.1.0",
    "pydantic>=2.7, <3.0.0",
    "pydantic-settings[toml]>=2.14.2,<2.15.0",
]



[project.urls]
Homepage = "https://recordedfuture-professionalservices.github.io/psengine/latest/"
Changelog = "https://recordedfuture-professionalservices.github.io/psengine/latest/CHANGELOG/"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-md==0.2.0",
    "pytest-random-order==1.2.0",
    "pytest-httpdbg==0.10.2",
    "ruff~=0.15.8",
    "mimesis>=19.1.0",
    "freezegun>=1.5.5",
]

docs = [
    "mike>=2.1.4,<2.3.0",
    "mkdocs~=1.6.1",
    "mkdocs-material>=9.7.6,<9.8.0",
    "mkdocstrings[python]>=1.0.4",
    "griffe-typingdoc>=0.2.8,<0.4.0",
    "mkdocs-codeinclude-plugin~=0.2.1",
    "markdown-include~=0.8.1",
    "mkdocs-exclude~=1.0.2",
    "pymdown-extensions~=11.0.1",

    # Tools for examples
    "rich==15.0.0",
    "logging-tree==1.10",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"
exclude-newer = "7 days"

[tool.uv.build-backend]
module-root = ""
module-name = "psengine"
source-exclude = [
    # Hidden directories
    ".git/**",
    ".github/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".venv/**",

    # Hidden files
    ".coverage",
    ".env",
    ".gitignore",
    ".python-version",

    # Build and test artifacts
    "dist/**",
    "build/**",
    "htmlcov/**",
    "*.egg-info/**",

    # Development/local files
    "local/**",
    "logs/**",
    "docs/**",
    "out/**",
    "data/**",
    "input/**",
    "workdir/**",

    # Tests
    "tests/**",

    # Release artifacts
    "CHANGELOG.md",

    # Lock and cache files
    "__pycache__/**",
    "uv.lock",
    "*.pyc",
    "*.pyo",
    "*.log",
    "*.log.*",
]


